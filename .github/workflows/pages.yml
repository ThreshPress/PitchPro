name: Publish web page

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Copy the site to docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a dist-pages/. docs/
          cat > index.html << 'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=docs/" />
              <link rel="canonical" href="docs/" />
              <title>Pitch Pro</title>
            </head>
            <body>
              <p><a href="docs/">Pitch Pro</a></p>
            </body>
          </html>
          EOF
      - name: Commit the published page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs index.html .nojekyll
          if git diff --cached --quiet; then
            echo "Site already current"
          else
            git commit -m "Update published page"
            git push
          fi
